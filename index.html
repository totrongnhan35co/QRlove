<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kỷ Niệm 9 Năm Yêu Nhau 💖 Mãi Bên Nhau Em Nhé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010206;
            font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        /* Background Twinkling Starfield Canvas */
        #starfieldCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* 3D Perspective Universe Container */
        #loveScene3D {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            perspective: 950px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
        }
        #loveScene3D:active {
            cursor: grabbing;
        }

        #cloudContainer {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        /* 3D Neon Glowing Text Phrases (Exact TikTok Video Style) */
        .love-word-3d {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-weight: 800;
            letter-spacing: 0.02em;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            pointer-events: none;
            padding: 2px 6px;
        }

        .neon-cyan {
            color: #ffffff;
            text-shadow:
                0 0 6px #ffffff,
                0 0 14px #00e5ff,
                0 0 28px #00e5ff,
                0 0 52px #00b8d4;
        }

        .neon-pink {
            color: #fff0f6;
            text-shadow:
                0 0 6px #ffffff,
                0 0 14px #ff2a85,
                0 0 28px #ff2a85,
                0 0 54px #e11d48;
        }

        .neon-gold {
            color: #fffbeb;
            text-shadow:
                0 0 6px #ffffff,
                0 0 14px #fbbf24,
                0 0 28px #f59e0b,
                0 0 50px #d97706;
        }

        /* 3D Floating Glowing Red Hearts */
        .heart-3d-node {
            position: absolute;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart-svg {
            fill: #ff1744;
            filter: drop-shadow(0 0 12px #ff1744) drop-shadow(0 0 26px #ff2a85);
        }

        /* Minimal Floating Music Toggle Button (Only UI element on viewer screen) */
        .music-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .music-floating-btn:hover {
            transform: scale(1.08);
            border-color: #ff2a85;
        }
    </style>
</head>
<body>
    <canvas id="starfieldCanvas"></canvas>

    <div id="loveScene3D">
        <div id="cloudContainer"></div>
    </div>

    <!-- Single Discrete Music Button in Bottom-Right Corner -->
    <button class="music-floating-btn" id="hudMusicBtn" title="Bật/Tắt nhạc">🎵</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titleParam = params.get("title") || "Mừng kỷ niệm 9 năm yêu nhau 💘";
        const wordsParam = params.get("words");
        const currentTheme = params.get("theme") || "both";

        const DEFAULT_WORDS = [
            titleParam,
            "Anh yêu em",
            "Kỷ niệm 9 năm yêu nhau",
            "Happy 9th Anniversary",
            "Cảm ơn em đã luôn bên anh",
            "Công chúa của anh",
            "Chúc em luôn xinh đẹp rạng rỡ",
            "Luôn vui vẻ và hạnh phúc nhé",
            "Thương em nhất trên đời",
            "9 Năm Tình Yêu Trọn Vẹn",
            "3285 Days Of Love",
            "Mãi nắm chặt tay nhau em nhé",
            "Em là điều tuyệt vời nhất"
        ];

        const phraseList = wordsParam
            ? wordsParam.split("|").map((s) => s.trim()).filter(Boolean)
            : DEFAULT_WORDS;

        // 1. Deep Space Starfield
        const starCanvas = document.getElementById("starfieldCanvas");
        const sctx = starCanvas.getContext("2d");
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = Array.from({ length: 240 }, () => ({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                r: Math.random() * 1.6 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: 0.015 + Math.random() * 0.03
            }));
        }
        window.addEventListener("resize", initStars);
        initStars();

        function renderStarfield() {
            sctx.fillStyle = "#010206";
            sctx.fillRect(0, 0, starCanvas.width, starCanvas.height);
            for (const st of stars) {
                st.phase += st.speed;
                const alpha = 0.2 + ((Math.sin(st.phase) + 1) * 0.4);
                sctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
                sctx.beginPath();
                sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                sctx.fill();
            }
            requestAnimationFrame(renderStarfield);
        }
        renderStarfield();

        // 2. Build Dense 3D Word & Glowing Heart Galaxy
        const container = document.getElementById("cloudContainer");
        const items3D = [];
        const WORD_COUNT = 85;
        const HEART_COUNT = 34;

        function pickNeonClass(idx) {
            if (currentTheme === "cyan") return "neon-cyan";
            if (currentTheme === "pink") return "neon-pink";
            if (currentTheme === "gold") return "neon-gold";
            return idx % 3 === 0 ? "neon-pink" : "neon-cyan";
        }

        function buildGalaxyNodes() {
            container.innerHTML = "";
            items3D.length = 0;

            const rangeX = Math.min(window.innerWidth * 1.35, 1050);
            const rangeY = Math.min(window.innerHeight * 1.25, 860);
            const rangeZ = 920;

            for (let i = 0; i < WORD_COUNT; i++) {
                const text = phraseList[i % phraseList.length];
                const el = document.createElement("div");
                el.className = `love-word-3d ${pickNeonClass(i)}`;
                el.textContent = text;

                const size = i % 11 === 0 ? 40 : i % 5 === 0 ? 27 : 18;
                el.style.fontSize = `${size}px`;
                container.appendChild(el);

                items3D.push({
                    el,
                    x: (Math.random() - 0.5) * rangeX,
                    y: (Math.random() - 0.5) * rangeY,
                    z: (Math.random() - 0.5) * rangeZ,
                    vy: -0.14 - Math.random() * 0.22
                });
            }

            const heartSvgMarkup = `<svg class="heart-svg" viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

            for (let i = 0; i < HEART_COUNT; i++) {
                const el = document.createElement("div");
                el.className = "heart-3d-node";
                const sz = i % 6 === 0 ? 54 : 24 + Math.floor(Math.random() * 18);
                el.style.width = `${sz}px`;
                el.style.height = `${sz}px`;
                el.innerHTML = heartSvgMarkup;
                container.appendChild(el);

                items3D.push({
                    el,
                    x: (Math.random() - 0.5) * rangeX,
                    y: (Math.random() - 0.5) * rangeY,
                    z: (Math.random() - 0.5) * rangeZ,
                    vy: -0.22 - Math.random() * 0.3
                });
            }
        }
        buildGalaxyNodes();

        // 3. 3D Rotation & Interactive Touch/Mouse Drag
        let rotX = -0.06;
        let rotY = 0.18;
        let targetRotX = -0.06;
        let targetRotY = 0.18;
        let zoomZ = 0;
        let dragging = false;
        let prevX = 0;
        let prevY = 0;

        const stage = document.getElementById("loveScene3D");
        stage.addEventListener("pointerdown", (e) => {
            dragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
            if (!isMusicOn) startMelody();
        });
        window.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            prevX = e.clientX;
            prevY = e.clientY;
            targetRotY += dx * 0.0048;
            targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX - dy * 0.0048));
        });
        window.addEventListener("pointerup", () => {
            dragging = false;
        });
        window.addEventListener("wheel", (e) => {
            zoomZ = Math.max(-360, Math.min(360, zoomZ - e.deltaY * 0.4));
        });

        function render3DLoop() {
            if (!dragging) {
                targetRotY += 0.0024;
            }
            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;

            const cosY = Math.cos(rotY);
            const sinY = Math.sin(rotY);
            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);
            const fov = 640;

            for (const item of items3D) {
                item.y += item.vy;
                if (item.y < -460) item.y = 460;

                const x1 = item.x * cosY - item.z * sinY;
                const z1 = item.z * cosY + item.x * sinY;
                const y2 = item.y * cosX - z1 * sinX;
                const z2 = z1 * cosX + item.y * sinX + zoomZ;

                const depth = fov + z2;
                if (depth > 55) {
                    const scale = fov / depth;
                    const opacity = Math.max(0.1, Math.min(1, (z2 + 520) / 760));
                    item.el.style.transform = `translate3d(${x1.toFixed(1)}px, ${y2.toFixed(1)}px, ${z2.toFixed(1)}px) translate(-50%, -50%) scale(${scale.toFixed(2)})`;
                    item.el.style.opacity = opacity.toFixed(2);
                } else {
                    item.el.style.opacity = "0";
                }
            }
            requestAnimationFrame(render3DLoop);
        }
        render3DLoop();

        // 4. Romantic Piano Melody Synthesizer
        let audioCtx = null;
        let isMusicOn = false;
        let melodyTimer = null;
        const MELODY = [
            261.63, 329.63, 392.00, 523.25,
            493.88, 392.00, 329.63, 349.23,
            440.00, 523.25, 659.25, 587.33,
            523.25, 392.00, 329.63, 261.63
        ];
        let mIdx = 0;

        function playRomanticChord(freq) {
            if (!audioCtx || !isMusicOn) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.13, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.55);
        }

        function startMelody() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();
                isMusicOn = true;
                document.getElementById("hudMusicBtn").textContent = "🎵";
                if (!melodyTimer) {
                    playRomanticChord(MELODY[0]);
                    melodyTimer = setInterval(() => {
                        if (!isMusicOn) return;
                        mIdx = (mIdx + 1) % MELODY.length;
                        playRomanticChord(MELODY[mIdx]);
                    }, 580);
                }
            } catch (err) {}
        }

        // Auto-start music on load or first touch
        window.addEventListener("load", () => {
            startMelody();
        });
        window.addEventListener("touchstart", () => {
            if (!isMusicOn) startMelody();
        }, { once: true });

        document.getElementById("hudMusicBtn").addEventListener("click", (e) => {
            if (!isMusicOn) {
                startMelody();
                e.target.textContent = "🎵";
            } else {
                isMusicOn = false;
                e.target.textContent = "🔇";
            }
        });
    </script>
</body>
</html>
