<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💘 Món Quà Bí Mật Dành Tặng Người Thương</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010206;
            font-family: 'Quicksand', 'Inter', system-ui, sans-serif;
            touch-action: none;
        }

        /* Background Twinkling Starfield Canvas */
        #starfieldCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 3D Perspective Stage */
        #loveScene3D {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            perspective: 820px;
            overflow: hidden;
            z-index: 2;
            cursor: grab;
        }
        #loveScene3D:active {
            cursor: grabbing;
        }

        #cloudContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .love-word-3d {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-weight: 800;
            letter-spacing: 0.02em;
            transform-origin: center center;
            will-change: transform, opacity;
            pointer-events: none;
        }

        /* Neon Cyan-Blue Glow (Exact match to TikTok video) */
        .neon-cyan {
            color: #ffffff;
            text-shadow:
                0 0 4px #ffffff,
                0 0 10px #7dd3fc,
                0 0 22px #00d8ff,
                0 0 42px #0088ff,
                0 0 70px #0051ff;
        }

        /* Neon Pink-Magenta Glow (Exact match to TikTok video) */
        .neon-pink {
            color: #fff5f9;
            text-shadow:
                0 0 4px #ffffff,
                0 0 10px #ff80bf,
                0 0 22px #ff1a8c,
                0 0 44px #e60073,
                0 0 75px #b30059;
        }

        /* Neon Warm Gold Glow */
        .neon-gold {
            color: #fffbeb;
            text-shadow:
                0 0 4px #ffffff,
                0 0 12px #fde047,
                0 0 26px #eab308,
                0 0 50px #ca8a04;
        }

        /* 3D Glowing Red Heart SVG Node */
        .heart-3d-node {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: center center;
            will-change: transform, opacity;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .heart-svg {
            fill: #ff1744;
            filter: drop-shadow(0 0 10px #ff1744) drop-shadow(0 0 24px #d50000);
        }

        /* Subtle Music Toggle Button in Corner (Viewer Only - No Edit UI) */
        .music-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 25;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 42, 133, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 18px rgba(255, 42, 133, 0.5);
            transition: transform 0.2s;
        }
        .music-floating-btn:hover {
            transform: scale(1.1);
        }

        /* Intro Gift Overlay (Tap to start music & enter 3D galaxy) */
        #scanIntroOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: radial-gradient(circle at center, #1e0b24 0%, #03040a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.65s ease, transform 0.65s ease;
        }
        #scanIntroOverlay.hidden-overlay {
            opacity: 0;
            transform: scale(1.3);
            pointer-events: none;
        }
        .intro-chat-card {
            background: #f8fafc;
            color: #0f172a;
            width: 100%;
            max-width: 340px;
            border-radius: 26px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(255, 23, 68, 0.45);
            text-align: center;
        }
        .msg-bubble {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }
        .pulse-heart-box {
            margin: 18px auto;
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: #fff1f2;
            border: 2px dashed #f43f5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            animation: heartBeat 1.1s infinite alternate;
            cursor: pointer;
        }
        @keyframes heartBeat {
            from { transform: scale(0.94); }
            to { transform: scale(1.08); }
        }
        .open-universe-btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #e11d48, #ff2a85);
            color: #fff;
            font-size: 0.96rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(225, 29, 72, 0.45);
        }
    </style>
</head>
<body>
    <!-- Gift Box Intro (Only shown until recipient taps to open gift & play music) -->
    <div id="scanIntroOverlay">
        <div class="intro-chat-card">
            <div class="msg-bubble" id="introMsg1">Mừng kỉ niệm 1000 ngày 💘</div>
            <div class="msg-bubble" id="introMsg2">Em có quà tặng anh nè 🎁</div>
            <div class="msg-bubble" id="introMsg3">Chạm vào trái tim để mở quà nhaaaa 🥰</div>
            <div class="pulse-heart-box" id="tapHeartBox">❤️</div>
            <button class="open-universe-btn" id="openGiftUniverseBtn">✨ Chạm Để Mở Quà ✨</button>
        </div>
    </div>

    <canvas id="starfieldCanvas"></canvas>

    <div id="loveScene3D">
        <div id="cloudContainer"></div>
    </div>

    <!-- Single Discrete Music Button in Bottom-Right Corner -->
    <button class="music-floating-btn" id="hudMusicBtn" title="Bật/Tắt nhạc">🎵</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titleParam = params.get("title") || "Mừng kỉ niệm 1000 ngày 💘";
        const msg2Param = params.get("msg2") || "Em có quà tặng anh nè 🎁";
        const wordsParam = params.get("words");
        const currentTheme = params.get("theme") || "both";
        const isInstant = params.get("instant") === "1";

        document.getElementById("introMsg1").textContent = titleParam;
        document.getElementById("introMsg2").textContent = msg2Param;

        const DEFAULT_WORDS = [
            "Em yêu anh",
            "Quỳnh Anh",
            "Đức Huy",
            "1000 Days",
            "Happy Anniversary",
            "Chúc anh luôn vui vẻ",
            "thành công",
            "vững vàng"
        ];

        const phraseList = wordsParam
            ? wordsParam.split("|").map((s) => s.trim()).filter(Boolean)
            : DEFAULT_WORDS;

        // 1. Deep Space Starfield
        const starCanvas = document.getElementById("starfieldCanvas");
        const sctx = starCanvas.getContext("2d");
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = Array.from({ length: 240 }, () => ({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                r: Math.random() * 1.6 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: 0.015 + Math.random() * 0.03
            }));
        }
        window.addEventListener("resize", initStars);
        initStars();

        function renderStarfield() {
            sctx.fillStyle = "#010206";
            sctx.fillRect(0, 0, starCanvas.width, starCanvas.height);
            for (const st of stars) {
                st.phase += st.speed;
                const alpha = 0.2 + ((Math.sin(st.phase) + 1) * 0.4);
                sctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
                sctx.beginPath();
                sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                sctx.fill();
            }
            requestAnimationFrame(renderStarfield);
        }
        renderStarfield();

        // 2. Build Dense 3D Word & Glowing Heart Galaxy
        const container = document.getElementById("cloudContainer");
        const items3D = [];
        const WORD_COUNT = 85;
        const HEART_COUNT = 34;

        function pickNeonClass(idx) {
            if (currentTheme === "cyan") return "neon-cyan";
            if (currentTheme === "pink") return "neon-pink";
            if (currentTheme === "gold") return "neon-gold";
            return idx % 3 === 0 ? "neon-pink" : "neon-cyan";
        }

        function buildGalaxyNodes() {
            container.innerHTML = "";
            items3D.length = 0;

            const rangeX = Math.min(window.innerWidth * 1.35, 1050);
            const rangeY = Math.min(window.innerHeight * 1.25, 860);
            const rangeZ = 920;

            for (let i = 0; i < WORD_COUNT; i++) {
                const text = phraseList[i % phraseList.length];
                const el = document.createElement("div");
                el.className = `love-word-3d ${pickNeonClass(i)}`;
                el.textContent = text;

                const size = i % 11 === 0 ? 40 : i % 5 === 0 ? 27 : 18;
                el.style.fontSize = `${size}px`;
                container.appendChild(el);

                items3D.push({
                    el,
                    x: (Math.random() - 0.5) * rangeX,
                    y: (Math.random() - 0.5) * rangeY,
                    z: (Math.random() - 0.5) * rangeZ,
                    vy: -0.14 - Math.random() * 0.22
                });
            }

            const heartSvgMarkup = `<svg class="heart-svg" viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

            for (let i = 0; i < HEART_COUNT; i++) {
                const el = document.createElement("div");
                el.className = "heart-3d-node";
                const sz = i % 6 === 0 ? 54 : 24 + Math.floor(Math.random() * 18);
                el.style.width = `${sz}px`;
                el.style.height = `${sz}px`;
                el.innerHTML = heartSvgMarkup;
                container.appendChild(el);

                items3D.push({
                    el,
                    x: (Math.random() - 0.5) * rangeX,
                    y: (Math.random() - 0.5) * rangeY,
                    z: (Math.random() - 0.5) * rangeZ,
                    vy: -0.22 - Math.random() * 0.3
                });
            }
        }
        buildGalaxyNodes();

        // 3. 3D Rotation & Interactive Touch/Mouse Drag
        let rotX = -0.06;
        let rotY = 0.18;
        let targetRotX = -0.06;
        let targetRotY = 0.18;
        let zoomZ = 0;
        let dragging = false;
        let prevX = 0;
        let prevY = 0;

        const stage = document.getElementById("loveScene3D");
        stage.addEventListener("pointerdown", (e) => {
            dragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
        });
        window.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            prevX = e.clientX;
            prevY = e.clientY;
            targetRotY += dx * 0.0048;
            targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX - dy * 0.0048));
        });
        window.addEventListener("pointerup", () => {
            dragging = false;
        });
        window.addEventListener("wheel", (e) => {
            zoomZ = Math.max(-360, Math.min(360, zoomZ - e.deltaY * 0.4));
        });

        function render3DLoop() {
            if (!dragging) {
                targetRotY += 0.0024;
            }
            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;

            const cosY = Math.cos(rotY);
            const sinY = Math.sin(rotY);
            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);
            const fov = 640;

            for (const item of items3D) {
                item.y += item.vy;
                if (item.y < -460) item.y = 460;

                const x1 = item.x * cosY - item.z * sinY;
                const z1 = item.z * cosY + item.x * sinY;
                const y2 = item.y * cosX - z1 * sinX;
                const z2 = z1 * cosX + item.y * sinX + zoomZ;

                const depth = fov + z2;
                if (depth > 55) {
                    const scale = fov / depth;
                    const opacity = Math.max(0.1, Math.min(1, (z2 + 520) / 760));
                    item.el.style.transform = `translate3d(${x1.toFixed(1)}px, ${y2.toFixed(1)}px, ${z2.toFixed(1)}px) translate(-50%, -50%) scale(${scale.toFixed(2)})`;
                    item.el.style.opacity = opacity.toFixed(2);
                } else {
                    item.el.style.opacity = "0";
                }
            }
            requestAnimationFrame(render3DLoop);
        }
        render3DLoop();

        // 4. Romantic Piano Melody Synthesizer
        let audioCtx = null;
        let isMusicOn = false;
        let melodyTimer = null;
        const MELODY = [
            261.63, 329.63, 392.00, 523.25,
            493.88, 392.00, 329.63, 349.23,
            440.00, 523.25, 659.25, 587.33,
            523.25, 392.00, 329.63, 261.63
        ];
        let mIdx = 0;

        function playRomanticChord(freq) {
            if (!audioCtx || !isMusicOn) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.13, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.55);
        }

        function startMelody() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            isMusicOn = true;
            if (!melodyTimer) {
                playRomanticChord(MELODY[0]);
                melodyTimer = setInterval(() => {
                    if (!isMusicOn) return;
                    mIdx = (mIdx + 1) % MELODY.length;
                    playRomanticChord(MELODY[mIdx]);
                }, 580);
            }
        }

        const introOverlay = document.getElementById("scanIntroOverlay");
        if (isInstant) {
            introOverlay.classList.add("hidden-overlay");
        }

        function unlockAndOpen() {
            introOverlay.classList.add("hidden-overlay");
            startMelody();
        }
        document.getElementById("openGiftUniverseBtn").addEventListener("click", unlockAndOpen);
        document.getElementById("tapHeartBox").addEventListener("click", unlockAndOpen);

        document.getElementById("hudMusicBtn").addEventListener("click", (e) => {
            if (!isMusicOn) {
                startMelody();
                e.target.textContent = "🎵";
            } else {
                isMusicOn = false;
                e.target.textContent = "🔇";
            }
        });
    </script>
</body>
</html>
